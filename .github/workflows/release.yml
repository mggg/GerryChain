name: Release GerryChain

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        type: string
        required: true
      upload_to:
        description: Upload destination
        type: choice
        required: true
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

# The native wheels are abi3 (cp311-abi3): one wheel per platform covers CPython 3.11+.
# Free-threaded CPython cannot use abi3 wheels and is a separate future build target.
jobs:
  validate:
    name: Validate tag and run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"

      - name: Install Python
        run: uv python install 3.13

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from the main branch, not $GITHUB_REF_NAME."
            exit 1
          fi
          project_version="$(uv version --short)"
          if [[ "$RELEASE_TAG" != "v$project_version" ]]; then
            echo "Tag $RELEASE_TAG does not match project version $project_version."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "$RELEASE_TAG is not a tag in this repository."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The tagged commit is not on the main branch."
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Run Cargo checks
        run: |
          cargo fmt --manifest-path gerrychain-core/Cargo.toml --check
          cargo clippy --manifest-path gerrychain-core/Cargo.toml -- -D warnings
          cargo test --manifest-path gerrychain-core/Cargo.toml

      - name: Run tests
        run: uv run --locked pytest

  wheels:
    name: Build wheel (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
          - os: macos-13
            name: macos-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"

      - name: Install Python
        run: uv python install 3.11

      - name: Build wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1.51.0
        with:
          command: build
          args: --release --locked --out dist
          manylinux: auto

      - name: Smoke test wheel
        shell: bash
        run: >-
          uv run --isolated --no-project --python 3.11 --with dist/*.whl python -c
          'import os; import importlib.util; from importlib.metadata import version;
          assert importlib.util.find_spec("rustworkx") is None;
          import gerrychain.rustworkx as rx;
          from gerrychain.rustworkx import _gerrychain;
          from gerrychain.examples import gerrymandria;
          assert version("gerrychain") == os.environ["RELEASE_VERSION"];
          assert _gerrychain.native_ping() == "gerrychain-core";
          assert rx.__version__ == "0.18.1";
          graph = rx.generators.grid_graph(4, 4);
          assert rx.is_connected(graph);
          seen = [];
          Visitor = type("V", (rx.visit.BFSVisitor,), {"discover_vertex": lambda self, v: seen.append(v)});
          rx.graph_bfs_search(graph, [0], Visitor());
          assert len(seen) == 16;
          assert len(gerrymandria().nodes) == 64'

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  sdist:
    name: Build and test source distribution
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"

      - name: Install Python
        run: uv python install 3.11

      - name: Build source distribution
        run: uv build --sdist

      # Compiles the extension from the sdist, proving it carries the Cargo sources.
      - name: Smoke test source distribution
        run: >-
          uv run --isolated --no-project --python 3.11 --with dist/*.tar.gz python -c
          'import os; import importlib.util; from importlib.metadata import version;
          assert importlib.util.find_spec("rustworkx") is None;
          import gerrychain.rustworkx as rx;
          from gerrychain.rustworkx import _gerrychain;
          from gerrychain.examples import gerrymandria;
          assert version("gerrychain") == os.environ["RELEASE_VERSION"];
          assert _gerrychain.native_ping() == "gerrychain-core";
          assert rx.__version__ == "0.18.1";
          graph = rx.generators.grid_graph(4, 4);
          assert rx.is_connected(graph);
          seen = [];
          Visitor = type("V", (rx.visit.BFSVisitor,), {"discover_vertex": lambda self, v: seen.append(v)});
          rx.graph_bfs_search(graph, [0], Visitor());
          assert len(seen) == 16;
          assert len(gerrymandria().nodes) == 64'

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: distributions-sdist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish and verify on TestPyPI
    needs: [validate, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/gerrychain/
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"

      - name: Install Python
        run: uv python install 3.13

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist/

      - name: Publish to TestPyPI
        run: >-
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/*

      - name: Install dependencies from PyPI
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/testpypi-venv"
          uv pip install --python "$RUNNER_TEMP/testpypi-venv/bin/python" dist/*manylinux*x86_64*.whl

      - name: Install wheel from TestPyPI
        run: |
          for attempt in {1..10}; do
            if uv pip install \
              --python "$RUNNER_TEMP/testpypi-venv/bin/python" \
              --reinstall-package gerrychain \
              --no-deps \
              --default-index https://test.pypi.org/simple/ \
              "gerrychain==$RELEASE_VERSION"; then
              exit 0
            fi
            if [[ "$attempt" == 10 ]]; then
              echo "TestPyPI did not make gerrychain $RELEASE_VERSION available in time."
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test TestPyPI installation
        run: >-
          "$RUNNER_TEMP/testpypi-venv/bin/python" -c
          'import os; import importlib.util; from importlib.metadata import version;
          assert importlib.util.find_spec("rustworkx") is None;
          import gerrychain.rustworkx as rx;
          from gerrychain.rustworkx import _gerrychain;
          from gerrychain.examples import gerrymandria;
          assert version("gerrychain") == os.environ["RELEASE_VERSION"];
          assert _gerrychain.native_ping() == "gerrychain-core";
          assert rx.__version__ == "0.18.1";
          graph = rx.generators.grid_graph(4, 4);
          assert rx.is_connected(graph);
          seen = [];
          Visitor = type("V", (rx.visit.BFSVisitor,), {"discover_vertex": lambda self, v: seen.append(v)});
          rx.graph_bfs_search(graph, [0], Visitor());
          assert len(seen) == 16;
          assert len(gerrymandria().nodes) == 64'

  pypi:
    name: Publish to PyPI
    needs: [validate, wheels, sdist, testpypi]
    if: ${{ inputs.upload_to == 'pypi' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gerrychain/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/*
