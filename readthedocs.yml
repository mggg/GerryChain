# .readthedocs.yaml

version: 2

sphinx:
  configuration: docs/conf.py
  builder: dirhtml

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - >-
        UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen
        --no-default-groups --group docs --group docs-exec
    pre_build:
      - >-
        UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run --frozen
        --no-default-groups --group docs --group docs-exec
        python docs/_refresh_notebooks.py
