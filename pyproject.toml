[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "gerrychain-core/Cargo.toml"
# The one compiled module, shipped inside the (currently stub) gerrychain.rustworkx package.
module-name = "gerrychain.rustworkx.rustworkx"
features = ["extension-module"]
# Ship example graph data (e.g. Gerrymandria) inside the wheel so that gerrychain.examples can
# load it via importlib.resources; py.typed marks the package as typed.
include = [
  { path = "gerrychain/py.typed", format = ["sdist", "wheel"] },
  { path = "gerrychain/examples/*.json", format = ["sdist", "wheel"] },
  { path = "gerrychain/rustworkx/*.pyi", format = ["sdist", "wheel"] },
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = "tools/generate_cargo_notices.py", format = "sdist" },
]

[tool.uv]
# uv only rebuilds the project when a cache key changes; without these, edits to the Rust
# sources would not trigger a rebuild of the editable install.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "gerrychain-core/Cargo.toml" },
  { file = "gerrychain-core/src/**/*.rs" },
]

[project]
name = "gerrychain"
version = "1.0.0"
description = "GerryChain is a Python library for building ensembles of districting plans using Markov Chain Monte Carlo methods."
readme = "README.md"
authors = [
  { name = "Data and Democracy Lab", email = "code@mggg.org" },
]
requires-python = ">=3.11"
# BSD-3-Clause for GerryChain itself; Apache-2.0 for the vendored rustworkx sources under
# gerrychain/rustworkx and gerrychain-core/src/rustworkx (see LICENSE.rustworkx and
# gerrychain-core/src/rustworkx/UPSTREAM.md).
license = "BSD-3-Clause AND Apache-2.0"
license-files = ["LICENSE", "LICENSE.rustworkx", "THIRD_PARTY_NOTICES.txt"]

dependencies = [
    "geopandas>=1.1.4",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "tqdm>=4.70.0",
]

[project.urls]
Documentation = "https://gerrychain.readthedocs.io/"
Repository = "https://github.com/mggg/GerryChain"
Issues = "https://github.com/mggg/GerryChain/issues"
Changelog = "https://github.com/mggg/GerryChain/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
# Vendored rustworkx sources and their inherited test suite keep upstream formatting so the
# diff against the recorded upstream revision stays mechanical.
extend-exclude = ["gerrychain/rustworkx", "tests/rustworkx_compat"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "UP006",
  "UP007",
  "UP045",
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN205",
  "ANN206",
]
ignore = [
    "E501",  # line length handled by Ruff's formatter
    "E203",  # whitespace before ':', handled by Ruff's formatter
    "E731",  # do not assign lambda expression
]
task-tags = ["TODO", "FIXME", "XXX", "HACK", "NOTE"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403", "F405"]
"tests/**" = ["ANN"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# tests/_foo is stale scratch (imports that no longer resolve); not collected by pytest.
# gerrychain/rustworkx and tests/rustworkx_compat are vendored upstream code checked by its
# own type stubs and inherited tests, not our rules.
exclude = ["tests/_foo", "gerrychain/rustworkx", "tests/rustworkx_compat"]

[tool.ty.rules]
missing-type-argument = "error"

[tool.pyright]
include = ["gerrychain", "tests"]
exclude = ["tests/_foo", "gerrychain/rustworkx", "tests/rustworkx_compat"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[dependency-groups]
dev = [
  # Linters, formatters, type checkers
  "myst-parser>=5.1.0",
  # Iteractive kernel
  "ipykernel>=7.3.0",
  "ipywidgets>=8.1.8",
  # Plotting
  "matplotlib>=3.11.1",
  # Testing
  "jupyter-cache>=1.0.1",
  "nbclient>=0.11.0",
  "nbformat>=5.10.4",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  # Other
  "pre-commit>=4.6.1",
  "ruff>=0.16.1",
  "ty>=0.0.65",
  "pyright>=1.1.411",
  # Test-only: the external rustworkx, pinned exactly, so the Graph.from_rustworkx() external
  # ingestion tests can exercise the real thing. Not a runtime dependency of gerrychain.
  "rustworkx==0.18.1",
]
docs = [
  "furo>=2025.12.19",
  "myst-nb>=1.4.0",
  "sphinx>=9.0.4",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7.0",
]
# Only what the executable docs examples need beyond the package itself (see
# tests/test_docs_snippets.py, the notebook scripts, and the docs-test /
# docs-cache-notebooks Makefile targets).
docs-exec = [
  "pytest>=9.1.1",
  "matplotlib>=3.11.1",
  "pillow>=12.3.0",
  "ipython>=9.16.0",
  "ipykernel>=7.3.0",
  "nbclient>=0.11.0",
  "nbformat>=5.10.4",
]


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true
