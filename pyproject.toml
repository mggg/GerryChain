[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
packages = { find = { include = ["gerrychain*"], exclude = ["tests*"] } }

[tool.setuptools.package-data]
# Ship example graph data (e.g. Gerrymandria) inside the wheel so that
# gerrychain.examples can load it via importlib.resources.
"gerrychain" = ["py.typed"]
"gerrychain.examples" = ["*.json"]

[project]
name = "gerrychain"
version = "1.0.0a2"
description = "GerryChain is a Python library for building ensembles of districting plans using Markov Chain Monte Carlo methods."
readme = "README.md"
authors = [
  { name = "Data and Democracy Lab", email = "code@mggg.org" },
]
requires-python = ">=3.11"
license = "BSD-3-Clause"


dependencies = [
    "geopandas>=1.1.1",
    "networkx>=3.6.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "rustworkx>=0.17.1",
    "scipy>=1.16.3",
    "shapely>=2.1.2",
    "tqdm>=4.67.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "UP006",
  "UP007",
  "UP045",
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN205",
  "ANN206",
]
ignore = [
    "E501",  # line length handled by Ruff's formatter
    "E203",  # whitespace before ':', handled by Ruff's formatter
    "E731",  # do not assign lambda expression
]
task-tags = ["TODO", "FIXME", "XXX", "HACK", "NOTE"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403", "F405"]
"tests/**" = ["ANN"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
missing-type-argument = "error"

[tool.pyright]
include = ["gerrychain", "tests/typing_assertions.py"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[dependency-groups]
dev = [
  # Linters, formatters, type checkers
  "myst-parser>=4.0.1",
  # Iteractive kernel
  "ipykernel>=6.30.1",
  "ipywidgets>=8.1.7",
  # Plotting
  "matplotlib>=3.10.7",
  # Testing
  "pytest>=8.4.2",
  "pytest-cov>=6.3.0",
  # Other
  "pre-commit>=4.3.0",
  "ruff>=0.14.9",
  "ty>=0.0.18",
  "pyright>=1.1.402",
]
docs = [
  "furo>=2024.8.6",
  "myst-nb>=1.4.0",
  "sphinx>=8.2.3",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
]
# Only what the executable docs examples need beyond the package itself (see
# tests/test_docs_snippets.py, the notebook scripts, and the docs-test /
# docs-cache-notebooks Makefile targets).
docs-exec = [
  "pytest>=8.4.2",
  "matplotlib>=3.10.7",
  "pillow>=11.0.0",
  "ipython>=8.30.0",
  "ipykernel>=6.30.1",
  "nbclient>=0.10.0",
  "nbformat>=5.10.0",
]


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true
