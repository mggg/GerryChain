[package]
name = "gerrychain-core"
version = "1.0.0"
edition = "2024"
description = "Rust extension for GerryChain"
license = "BSD-3-Clause AND Apache-2.0"
repository = "https://github.com/mggg/GerryChain"
# Matches the rustworkx 0.18.1 MSRV so the vendored binding sources compile unchanged.
rust-version = "1.85"
publish = false

[lib]
name = "gerrychain_core"
crate-type = ["cdylib"]

# Dependency versions mirror rustworkx 0.18.1 (workspace versions inlined); see
# src/rustworkx/UPSTREAM.md for the provenance record.
[dependencies]
foldhash = "0.1.5"
fixedbitset = "0.5.7"
indexmap = { version = ">=1.9, <3", features = ["rayon"] }
ndarray = { version = "0.17.2", features = ["rayon"] }
ndarray-stats = "0.7.0"
num-bigint = "0.4"
num-complex = "0.4"
num-traits = "0.2"
numpy = "0.29"
petgraph = "0.8"
quick-xml = "0.37"
rand = "0.10"
rand_distr = "0.6"
rand_pcg = "0.10"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.0", features = ["union"] }
rustworkx-core = "=0.18.1"
flate2 = "1.0.35"
pest = "2.8"
pest_derive = "2.8"
nalgebra-sparse = { version = "=0.10", features = ["io"] }

[dependencies.hashbrown]
version = "0.15"  # Implicitly required to match PyO3's and `petgraph`'s via cross-API use.
features = ["rayon"]

[dependencies.pyo3]
version = "0.29"
# abi3-py311: one stable-ABI wheel per platform for CPython 3.11+ (upstream uses abi3-py310;
# GerryChain's floor is 3.11). Remaining features mirror upstream.
features = ["abi3-py311", "hashbrown", "num-bigint", "num-complex", "indexmap", "py-clone"]

[dependencies.sprs]
version = "^0.11"
default-features = false
features = ["multi_thread"]

[features]
# Enabled by maturin builds (see [tool.maturin] in pyproject.toml). Kept out of the default
# set so `cargo test` links libpython instead of building an unlinkable extension.
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "fat"
codegen-units = 1
